services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-YourStrong@Passw0rd}
    ports:
      - "1433:1433"
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - sqlserver-data:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__RegistrationDatabase: Server=database,1433;Database=StudentCourseRegistration;User Id=sa;Password=${MSSQL_SA_PASSWORD:-YourStrong@Passw0rd};TrustServerCertificate=True;Encrypt=False;
      Jwt__Issuer: StudentCourseRegistration
      Jwt__Audience: StudentCourseRegistration.Client
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-replace-this-development-key-with-a-secure-secret-of-at-least-32-characters}
      Jwt__ExpiresInMinutes: 60
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      # Baked into the bundle at build time; nginx proxies /api → api:8080.
      VITE_API_BASE_URL: /api/v1
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  sqlserver-data:

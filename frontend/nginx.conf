server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    # Serve the compiled SPA from the docker volume.
    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip text assets.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache hashed Vite assets aggressively — they're content-addressed.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse proxy API and health requests to the backend service.
    # The `api` hostname resolves to the compose service of the same name.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8080/health;
    }

    # SPA fallback — every other route serves index.html so client-side
    # routing (React Router) can take over on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
